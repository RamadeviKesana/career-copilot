<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Copilot — Job Match Analyzer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .app { width: 100%; max-width: 760px; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 26px; font-weight: 600; color: #111; }
  .header p { font-size: 15px; color: #666; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.25rem; }
  .card label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .upload-zone { border: 1.5px dashed #d0d0d0; border-radius: 8px; padding: 1.25rem 1rem; text-align: center; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; }
  .upload-zone:hover { background: #f9f9f9; }
  .upload-zone.has-file { border-color: #1D9E75; background: #f0faf6; }
  .upload-zone .icon { font-size: 22px; margin-bottom: 6px; }
  .upload-zone span { font-size: 13px; color: #888; display: block; }
  .upload-zone.has-file span { color: #0F6E56; font-weight: 500; }
  textarea { width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: inherit; color: #111; background: #fff; resize: none; outline: none; transition: border-color 0.15s; }
  textarea:focus { border-color: #aaa; }
  input[type="file"] { display: none; }
  .analyze-btn { width: 100%; padding: 14px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .analyze-btn:hover { opacity: 0.85; }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .result-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.5rem; margin-top: 16px; display: none; }
  .loading { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #888; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; animation: pulse 1s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .score-row { display: flex; align-items: center; gap: 20px; margin-bottom: 1.25rem; }
  .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
  .score-num { font-size: 24px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 11px; margin-top: 2px; opacity: 0.7; }
  .score-title { font-size: 18px; font-weight: 600; color: #111; }
  .score-sub { font-size: 13px; color: #666; margin-top: 4px; }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.25rem 0; }
  .result-section { margin-bottom: 1rem; }
  .result-section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 8px; }
  .result-section ul { list-style: none; padding: 0; }
  .result-section ul li { font-size: 14px; color: #222; padding: 5px 0; display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .result-section ul li::before { content: '•'; color: #aaa; flex-shrink: 0; }
  .tip-box { background: #f0faf6; border: 1px solid #9FE1CB; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #0F6E56; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🎯 Career Copilot</h1>
    <p>Upload your resume and paste a job description — get your match score instantly.</p>
  </div>

  <div class="grid">
    <div class="card">
      <label>📄 Your Resume</label>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('resumeFile').click()">
        <div class="icon">⬆️</div>
        <span id="uploadLabel">Click to upload .txt file</span>
        <span style="font-size:11px; margin-top:4px;">or paste text below</span>
      </div>
      <input type="file" id="resumeFile" accept=".txt" onchange="handleFile(event)">
      <textarea id="resumeText" placeholder="Paste your resume text here..." rows="6"></textarea>
    </div>

    <div class="card">
      <label>💼 Job Description</label>
      <textarea id="jdText" placeholder="Paste the job description here..." rows="12"></textarea>
    </div>
  </div>

  <button class="analyze-btn" onclick="analyze()">Analyze My Match →</button>

  <div class="result-card" id="resultCard">
    <div id="loadingState" class="loading">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <span>Analyzing your match with AI...</span>
    </div>
    <div id="resultContent" style="display:none;">
      <div class="score-row">
        <div class="score-circle" id="scoreCircle">
          <div class="score-num" id="scoreNum">—</div>
          <div class="score-label">/ 100</div>
        </div>
        <div>
          <div class="score-title" id="scoreTitle"></div>
          <div class="score-sub" id="scoreSub"></div>
        </div>
      </div>
      <hr class="divider">
      <div class="result-section">
        <h3>✅ Strengths</h3>
        <ul id="strengthsList"></ul>
      </div>
      <div class="result-section">
        <h3>❌ Missing Skills</h3>
        <ul id="missingList"></ul>
      </div>
      <div class="result-section">
        <h3>💡 Top Tip</h3>
        <div class="tip-box" id="tipBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
let resumeContent = '';

const GROQ_API_KEY = "gsk_your_actual_key";

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('uploadZone').classList.add('has-file');
  document.getElementById('uploadLabel').textContent = '✓ ' + file.name;
  const reader = new FileReader();
  reader.onload = () => {
    resumeContent = reader.result;
    document.getElementById('resumeText').value = resumeContent;
  };
  reader.readAsText(file);
}

async function analyze() {
  const resume = document.getElementById('resumeText').value.trim();
  const jd = document.getElementById('jdText').value.trim();

  if (!resume) { alert('Please add your resume text!'); return; }
  if (!jd) { alert('Please paste a job description!'); return; }

  const btn = document.querySelector('.analyze-btn');
  const card = document.getElementById('resultCard');
  const loading = document.getElementById('loadingState');
  const resultDiv = document.getElementById('resultContent');

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  card.style.display = 'block';
  loading.style.display = 'flex';
  resultDiv.style.display = 'none';
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `You are a career coach. Analyze this resume vs job description.

Respond in EXACTLY this format (no extra text):
SCORE: [0-100]
VERDICT: [short phrase like "Strong match" or "Partial match" or "Weak match"]
STRENGTHS:
- [strength 1]
- [strength 2]
- [strength 3]
MISSING:
- [missing skill 1]
- [missing skill 2]
- [missing skill 3]
TIP: [one specific actionable tip]

Resume:
${resume}

Job Description:
${jd}`
        }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.choices[0].message.content;

    const score = parseInt((text.match(/SCORE:\s*(\d+)/) || [])[1] || 0);
    const verdict = (text.match(/VERDICT:\s*(.+)/) || [])[1]?.trim() || 'Analysis complete';
    const strengthsRaw = (text.match(/STRENGTHS:([\s\S]*?)MISSING:/) || [])[1] || '';
    const missingRaw = (text.match(/MISSING:([\s\S]*?)TIP:/) || [])[1] || '';
    const tip = (text.match(/TIP:\s*(.+)/) || [])[1]?.trim() || '';

    const parseList = raw => raw.split('\n').map(l => l.replace(/^[-•]\s*/, '').trim()).filter(Boolean);

    document.getElementById('scoreNum').textContent = score;
    document.getElementById('scoreTitle').textContent = verdict;
    document.getElementById('scoreSub').textContent =
      score >= 70 ? 'You are a strong candidate — go ahead and apply!' :
      score >= 50 ? 'Decent match — address the gaps before applying.' :
      'Low match — build more relevant skills first.';

    const circle = document.getElementById('scoreCircle');
    if (score >= 70) { circle.style.background = '#f0faf6'; circle.style.color = '#0F6E56'; }
    else if (score >= 50) { circle.style.background = '#FAEEDA'; circle.style.color = '#854F0B'; }
    else { circle.style.background = '#FCEBEB'; circle.style.color = '#A32D2D'; }

    const fillList = (id, items) => {
      const ul = document.getElementById(id);
      ul.innerHTML = '';
      items.forEach(item => {
        if (!item) return;
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
    };

    fillList('strengthsList', parseList(strengthsRaw));
    fillList('missingList', parseList(missingRaw));
    document.getElementById('tipBox').textContent = tip;

    loading.style.display = 'none';
    resultDiv.style.display = 'block';

  } catch(err) {
    loading.style.display = 'none';
    resultDiv.style.display = 'block';
    document.getElementById('resultContent').innerHTML = `<p style="color:#c00; font-size:14px;">Error: ${err.message}</p>`;
  }

  btn.disabled = false;
  btn.textContent = 'Analyze My Match →';
}
</script>
</body>
</html>
